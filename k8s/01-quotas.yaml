# Hard limits per namespace so one team/app cannot eat the whole cluster
apiVersion: v1
kind: ResourceQuota
metadata: {name: myapp-quota, namespace: myapp}
spec:
  hard:
    pods: "10"
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
---
apiVersion: v1
kind: LimitRange
metadata: {name: myapp-defaults, namespace: myapp}
spec:
  limits:
    - type: Container
      default: {cpu: 250m, memory: 256Mi}
      defaultRequest: {cpu: 100m, memory: 128Mi}
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: mydb-quota, namespace: mydb}
spec:
  hard:
    pods: "3"
    persistentvolumeclaims: "2"
    requests.storage: 10Gi
    limits.cpu: "2"
    limits.memory: 2Gi
---
apiVersion: v1
kind: LimitRange
metadata: {name: mydb-defaults, namespace: mydb}
spec:
  limits:
    - type: Container
      default: {cpu: 500m, memory: 512Mi}
      defaultRequest: {cpu: 250m, memory: 256Mi}
